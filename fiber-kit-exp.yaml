# fiber-kit-exp.yaml -- global fiber-kit operating-point config (a FLAT FK_* map).
#
# This is the file config.load_global_config() reads: $FK_CONFIG, else ./fiber-kit.yaml in
# the working directory (the same file scripts/fiber-pipeline reads). Every FK_* key here
# OVERRIDES the matching per-session <session>.yaml fiber_kit.<stage> value, and is itself
# overridden by an explicit CLI flag or a plan param. So this is where a session-independent
# operating point lives.
#
# MERGE, do not replace: if you already maintain a fiber-kit-exp.yaml with other tuned FK_*
# knobs, add ONLY the two FK_*_OFF_THR lines below to it. This file intentionally lists just
# the offset-veto knobs so dropping it in does not clobber the rest of your operating point.
#
# What these turn on -- the inter-channel-TIMING co-veto added in patches 0259 (fiber-xcorr-
# merge) and 0260 (fiber-session), both now upstream. Footprint cosine is only half of
# identity; two co-located cells can match in footprint yet differ in per-channel spike
# TIMING (the drift-robust half). The veto refuses a merge whose two RAW-template inter-
# channel offset profiles differ by more than off-thr (xcorr LAG samples). fiber-session
# clusters on stderiv but reads .spk.standard for the raw templates (stderiv common-mode
# removal mixes channels and corrupts timing); if .spk.standard is absent the gate is
# silently inert.
#
# THE VALUE IS A STARTING POINT, NOT VALIDATED. 0.2 sits inside the g5 calibration
# (same-cell ~0.11, distinct co-located ~0.26) and above the same-cell level, so it should
# catch distinct pairs while sparing same-cell drift -- but it was NOT tuned end-to-end on a
# curated sort (no .fil in-sandbox, and fine-split OOMs there). Tune it against your curated
# ground truth: raise it if it splits a cell you know is single; lower it toward ~0.15 if
# look-alike co-located cells still merge. Track same-unit recall vs false-merge as you move
# it. NB the sibling stages (subcluster/link) expose off-n-ref, an SNR-adaptive form that
# loosens ~1/sqrt(n) below a spike count -- worth adopting here later so low-count/low-energy
# fibers are not over-vetoed by a flat threshold.

FK_XCM_OFF_THR: 0.2       # fiber-xcorr-merge inter-channel-timing veto ON (default 0.0 = off)
FK_SESSION_OFF_THR: 0.2   # fiber-session Block-A inter-channel-timing veto ON (default 0.0 = off)

# off-amp-frac left at its 0.3 default (channels below 0.3 of the dominant peak-to-peak carry
# no reliable timing -- see the energy/reliability analysis: coefficient reliability only
# clears ~usable near the dominant channels, while xcorr timing survives to lower energy, so
# 0.3 is if anything conservative). Uncomment to change:
# FK_XCM_OFF_AMP_FRAC: 0.3
# FK_SESSION_OFF_AMP_FRAC: 0.3
