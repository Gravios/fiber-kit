# fiber-tune search spec: the HYBRID fine-split feature space (standard x stderiv) and the rkk effort
# knobs, searched on top of the exp-search winner.
#
#   fiber-tune search  <session> <elec> --spec plans/tune/hybrid-search.yaml           # resumable; --max-trials N
#   fiber-tune show    <session> <elec> --spec plans/tune/hybrid-search.yaml
#   fiber-tune confirm <session> <elec> --spec plans/tune/hybrid-search.yaml --top 3 --chunks all
#
# Results: <session dir>/fk-bench/tune/hybrid-search/{trials.jsonl, trials.tsv, summary.md, best.yaml}.
#
# TEMPLATE.  `config:` is fiber-kit-best.yaml, i.e. the previous fk-tune run's best.yaml folded into the
# shipped profile (gen_best_profile.py: the exp-search winner on g6 0316 -- no-psame-chunk plan,
# CFIBER_Q 0.85, INCL_ASSIGN 1, DIP_ALPHA 0.03, THETA_CELL 5, XCM_COS 0.94, psame theta 0.9 chunk-aware 1).
# To start from a lab run's own best.yaml instead, point `config:` at fk-bench/tune/<name>/best.yaml.
# Everything that search found inert (INCLUSION_K / DECONV_ASSIGN with INCL_ASSIGN 1, ALINK_AMP_THR /
# MAX_GAP, psame knn / cannot-link / min-n) is left at the template's value and not searched again.
#
# WHAT IS SEARCHED, AND WHY IN THIS ORDER (upstream first; every later group is tuned on the upstream
# winner):
#   1. hybrid   (2026-11-13: settled, see below; the stage is now the on/off control, last)  the feature space of the fine split: the raw block's weight and width, whether the
#               stderiv block is the lag space (_D34) or classic PC1-3, and LAST whether the hybrid is on
#               at all.  The one-chunk test on 20120312 g6 (claude/hybrid-feature-tuning-plan-2026-11-11.md)
#               ranked standard x stderiv_C5_D34 (scale 1) > standard x stderiv_C5 > stderiv_C5 >
#               stderiv_C5_D34, with the gain on units of half-width >= 6 samples and the only cost a few
#               more small noise-led clusters -- hence FEAT_LAG searched HERE, with the hybrid, not after it.
#               The search STARTS with the hybrid on (`start:`): coordinate ascent tries one knob at a time,
#               so with FEAT_HYBRID [0, 1] first and the default-hybrid trial losing, every SCALE / PCS
#               trial after it ran with the hybrid OFF -- six identical re-sorts of the start (the first
#               0316 run, 2026-11-12: seven rows at 0.4159 to the last digit).  Off is now the last value
#               tried, against the best hybrid setting; its sort is the one every earlier run made.
#   2. rkk      the splitter's effort: a starting-K sweep, restarts, more cluster<->realign passes,
#               and the dimensionality it sees (the hybrid projection is 48 wide; the per-cluster SVD
#               to rkk-dims / DIP_DIM may be dominated by neither block).  MEASURED on the three
#               messiest clusters of the 0312 chunk (2119 / 1713 / 1248 spikes, 5-8-noise mixes):
#               restarts alone change nothing (4 starts at --rkk-max: identical labels); the K sweep is
#               what acts, and restarts help on top of it -- completeness (share of a curated unit in
#               its largest sub-cluster) 0.26 -> 0.76, 0.45 -> 0.59, 0.11 -> 0.24 at unchanged purity,
#               the reserve 244 -> 41 / 307 -> 43 spikes, sub-clusters 15 -> 5.  Cost x20-30 per
#               cluster.  So RKK_MIN is searched FIRST (it must be on for RKK_STARTS to matter) and
#               RKK_STARTS after it; the plain restarts-only point is not in the grid.
#   3. session  the two session knobs the hybrid may move (the dip gate and the inclusion core).
#   4. merge / psame  the downstream merges, cheap, re-tuned on the new fibers.
#
# COST.  A hybrid or rkk knob re-sorts the chunks (one fiber-session each, ~10-15 min per 2 x 18-min chunks
# on the lab machine, 40-55 min on 2 cores; a sweep + 8 starts multiplies the fine split's share of that by
# ~20); the merge / psame knobs re-run only their step.  Stage 1 is at most 2 + 3 + 3 + 2 = 10 trials per
# pass, stage 2 at most 3 + 3 + 2 + 2 + 2 = 12.
#
# 2026-11-13.  The clean run on 0316 chunks 2-3 (fiber-kit 0.67.5+) chose scale 2 / 3 PCs / lag 0 (0.376 vs
# plain 0.345, core truth 0.391 vs 0.359); `start:` is now that winner, and the hybrid stage keeps only the
# on/off control (last).  The full-plan confirm found the margin undone by psame's dbic on realigned windows
# (fixed in 0.67.12, FK_PSAME_ALIGN_PAIRS); confirm again after it.  NEW, searched FIRST: Block N, the
# neighbourhood re-cluster (FK_SESSION_NEIGH_*; 0312 g6 chunks 0-1: 0.582 -> 0.600 (1 pass) -> 0.609 (2),
# int_acc 0.509 -> 0.568, ARI 0.564 -> 0.654, no unit worse), and the rkk die-out retry
# (FK_SESSION_RKK_PTS_PER_START; a group of <= ~120 spikes gets no cluster at all from the start at
# --rkk-max, and a 12-min chunk holds 144 spikes of a 0.2 Hz unit).  Both re-sort the chunks per value.
#
# READ, beyond the objective (trials.tsv): int_acc / int_rec (the broad, high-rate units the exp search
# lost, 0.468 -> 0.389 -- the hybrid's first job), all_frag80 (over-splitting: should stay within +10%
# of the start), merges_pyr_pyr (the raw block can merge co-located narrow pyramidals: must not rise),
# and accuracy per truth unit against its template half-width -- the gain belongs on hw >= 6, SNR < ~8
# units; a gain elsewhere means a different mechanism than the one argued and is not grounds to adopt.
name: hybrid-search
config: ../../src/fiber_kit/fiber-kit-best.yaml  # the previous fk-tune best, as the shipped profile
truth:
  clu: /path/to/curated.clu.6                     # e.g. the 20120316 g6 truth (gt.clu / gt.res)
  res: /path/to/curated.res.6                     # the .res the .clu indexes (same spike count)
  units: ""                                       # "" = every unit > 1; or e.g. "2-34"
  exclude: ""
  tol: 5
  int_rate: 5.0
  # core: {k: 3.0, min_n: 50}                     # score each unit on the spikes that fit its own template (docs/bench.md,
                                                  #   "Truth core"): a contaminated interneuron no longer caps a cleaner sort's
                                                  #   accuracy nor charges a merge to the cluster that isolates its contamination
chunks: "2-3"                                     # the exp-search chunks, so rows compare with that table
score_at: psame
objective: "all_acc - 0.005*merges"
passes: 2
min_gain: 0.002
search_realign: false                             # confirm re-runs the best with the realign steps
set: {}
start: {FK_SESSION_FEAT_HYBRID: 1, FK_SESSION_HYBRID_SCALE: 2.0, FK_SESSION_HYBRID_PCS: 3}   # the clean run's winner
plans:
  best: base                                      # fiber-kit-best.yaml's plan (psame-chunk already dropped)
stages:
  - name: neigh                                   # Block N and the small-group retry (each value re-sorts)
    knobs:
      FK_SESSION_NEIGH_PASSES:     [0, 1, 2]                  # 0312: 0.582 / 0.600 / 0.609
      FK_SESSION_NEIGH_K:          [2, 3, 4]                  # neighbours drawn per seed cluster (1..K)
      FK_SESSION_NEIGH_COS:        [0.6, 0.7, 0.8]            # who counts as a neighbour
      FK_SESSION_RKK_PTS_PER_START: [0, 21]                   # retry a died-out start with K capped at N // 21
  - name: rkk                                     # the splitter's effort and dimensionality
    knobs:
      FK_SESSION_RKK_MIN:          [0, 20, 35]                # 0 = one start at --rkk-max; else sweep K from here (acts)
      FK_SESSION_RKK_STARTS:       [1, 4, 8]                  # restarts per K: inert without the sweep, 8 > 4 with it
      FK_SESSION_RKK_REALIGN_ITERS: [2, 4]                    # cluster<->realign passes
      "session:rkk-dims":          [6, 8]                     # per-cluster SVD dims the CEM runs on
      FK_SESSION_DIP_DIM:          [4, 6]
  - name: session
    knobs:
      FK_SESSION_DIP_ALPHA:        [0.02, 0.03]
      FK_SESSION_INCLUSION_K:      [3.0, 3.5]
  - name: merge
    knobs:
      FK_XCM_COS_THR:              [0.92, 0.94, 0.96]
      FK_XCM_RVU_THR:              [0, 0.5]
  - name: psame
    knobs:
      "psame:theta":               [0.8, 0.9, 0.95]
      "psame:chunk-aware":         [0, 1]
      FK_PSAME_ALIGN_PAIRS:        [1, 0]                     # dbic on pair-aligned windows (0.67.12) vs raw
  - name: hybrid                                  # the control: the plain space against the tuned hybrid
    knobs:
      FK_SESSION_FEAT_HYBRID:      [1, 0]
