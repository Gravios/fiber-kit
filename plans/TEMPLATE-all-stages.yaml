  # ===== fiber-refit : Refit the fiber model (per-unit, per-chunk templates / positions / signatures) to a MANUALLY CURATED .clu, taking the curator's grouping as final (no re-merge/split). Writes a refreshed <...>.units.npz for fiber-link / fiber-drift / fiber-qc. =====
  # - {stage: fiber-refit, in: <tag>, out: <tag>, params: {
  #       channels: ""                    # override: comma-separated physical channels
  #       ntotal: ""                      # override: total channels in the recording
  #       nchan: ""                       # override: channels in this group
