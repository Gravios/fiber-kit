# ============================================================================
#  fiber-kit-klusters-manifold.yaml  —  the KLUSTERS REFINEMENT profile: fiber-manifold alone.
#
#  What Klusters' fiber-kit-manifold plugin runs on a SELECTED unit (exported as a sub-session: the
#  temp-file method, docs/pipeline.md "Reclustering a selection"): the off-spike-channel field manifold
#  of the unit, fitted in sliding windows (drift-aware), returned as the unit's children (.clc/.clp)
#  and as the per-spike feature space <session>.fet.manifold.<group>.  The stage never moves a spike
#  between units, so the returned .clu is the selection as it was.
#
#  The seed .clu Klusters writes has no stage tag ('' = the base), hence `in: ""`; the final .clu/.clc/.clp
#  carry the tag `manifold` (what --final-clu delivers).  Nothing here may name a session.
#
#  WHERE IT LIVES.  `fk install klusters-plugin` copies this file next to the fiber-kit-manifold.xml
#  descriptor in Klusters' plugin directory and points the descriptor's `config` parameter at that copy.
#  The descriptor's own parameters (window, step, SNR, children, time bins, off-channel fraction) arrive as
#  `fk run --FK_MANIFOLD_... value` and WIN over this file; edit this file for the others.
#  PRECEDENCE (highest first):  plugin parameter / CLI flag  >  exported FK_* env var  >  THIS FILE  >  built-in default
# ============================================================================
pipeline:
  - {stage: fiber-manifold, name: manifold, in: "", out: manifold}

# ---- fiber-manifold knobs (fiber-kit-exp.yaml section [G] has the full comments) ----
FK_MANIFOLD_WINDOW_MIN:  20       # (min) sliding window length; each window fits its own template
FK_MANIFOLD_STEP_MIN:    5        # (min) window step; each spike takes the nearest window's fit
FK_MANIFOLD_MIN_N:       10       # the selection is examined whatever its size (a session run uses 2000)
FK_MANIFOLD_MIN_WINDOW_N: 300     # spikes a window needs for its own template; fewer: the nearest spikes
FK_MANIFOLD_SPK:         standard # the waveform space (.spk.<variant>) the fields are fitted in
FK_MANIFOLD_CHANNELS:    off      # off | full: the off-spike channels, or every channel of the group
FK_MANIFOLD_OFF_FRAC:    0.4      # off-spike channel = template trough below this fraction of the deepest
FK_MANIFOLD_MIN_OFF:     3        # at least this many off-spike channels
FK_MANIFOLD_SNR:         4.0      # (noise sd) a field is present at or above this matched-filter SNR
FK_MANIFOLD_LAG_MS:      0.9      # (ms) largest |lag| searched
FK_MANIFOLD_DEAD_MS:     0.6      # (ms) |lag| below this is 'coincident' (the detector's dead time)
FK_MANIFOLD_POS_BINS:    3        # position bins over the off-channel span
FK_MANIFOLD_MAX_CHILDREN: 200     # most children per unit
FK_MANIFOLD_TIME_BINS:   12       # time bins the children are split into (0 = none)
FK_MANIFOLD_REFRAC_MS:   2.0      # (ms) ISI pairs below this get the farther-from-median member flagged
FK_MANIFOLD_NOISE_N:     20000    # noise snippets for the SNR calibration
FK_MANIFOLD_WRITE_FET:   1        # write the .fet.manifold.<g> feature space
FK_MANIFOLD_SEED:        0
FK_MANIFOLD_JOBS:        0        # one process per CPU over the selected units; FIBER_KIT_GPU=1 for the GPU
FK_MANIFOLD_SIGNAL:      ""       # "" = the sub-session's linked .nst; a .fil path for per-window noise
